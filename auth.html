<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habit Tracker — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<script src="theme.js"></script>
<style>
:root{--bg:#0d0d0d;--surface:#141414;--card:#1a1a1a;--border:#2a2a2a;--accent:#c8f060;--accent2:#f0a060;--accent3:#60c8f0;--red:#f06060;--text:#e8e8e8;--muted:#666;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Space Mono',monospace;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(200,240,96,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(200,240,96,0.03) 1px,transparent 1px);background-size:40px 40px;}
.wrap{width:100%;max-width:440px;position:relative;z-index:1;}
.brand{text-align:center;margin-bottom:32px;}
.brand-logo{font-family:'Syne',sans-serif;font-weight:800;font-size:32px;letter-spacing:-1px;color:var(--accent);}
.brand-logo span{color:var(--text);}
.brand-sub{font-size:12px;color:var(--muted);margin-top:6px;letter-spacing:2px;text-transform:uppercase;}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:36px;}
.tabs{display:flex;margin-bottom:28px;background:var(--surface);border-radius:8px;padding:4px;}
.tab{flex:1;padding:10px;text-align:center;font-family:'Space Mono',monospace;font-size:12px;font-weight:700;cursor:pointer;border-radius:6px;border:none;background:transparent;color:var(--muted);letter-spacing:1px;text-transform:uppercase;transition:all 0.2s;}
.tab.active{background:var(--accent);color:#0d0d0d;}
.fg{margin-bottom:18px;}
label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:7px;}
input[type=text],input[type=email],input[type=password]{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:'Space Mono',monospace;font-size:14px;padding:12px 16px;border-radius:8px;outline:none;transition:border-color 0.2s;}
input:focus{border-color:var(--accent);}
input::placeholder{color:var(--muted);}
.ig{position:relative;}
.eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px;cursor:pointer;}
.btn-main{width:100%;padding:14px;background:var(--accent);color:#0d0d0d;border:none;border-radius:8px;font-family:'Space Mono',monospace;font-size:13px;font-weight:700;cursor:pointer;letter-spacing:1px;transition:all 0.15s;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-main:hover{background:#d8f070;transform:translateY(-1px);}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;}
.divider-line{flex:1;height:1px;background:var(--border);}
.divider-text{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
.btn-google{width:100%;padding:13px;background:transparent;color:var(--text);border:1px solid var(--border);border-radius:8px;font-family:'Space Mono',monospace;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;transition:all 0.15s;}
.btn-google:hover{border-color:#4285F4;background:rgba(66,133,244,0.06);}
.forgot{text-align:right;margin-top:-10px;margin-bottom:18px;}
.forgot a{font-size:11px;color:var(--muted);text-decoration:none;cursor:pointer;}
.forgot a:hover{color:var(--accent);}
.msg{padding:10px 14px;border-radius:6px;font-size:12px;margin-bottom:16px;display:none;}
.msg.error{background:rgba(240,96,96,0.1);border:1px solid rgba(240,96,96,0.3);color:var(--red);}
.msg.success{background:rgba(200,240,96,0.1);border:1px solid rgba(200,240,96,0.3);color:var(--accent);}
.sbar{display:none;gap:4px;margin-top:7px;}
.seg{flex:1;height:3px;border-radius:2px;background:var(--border);transition:background 0.3s;}
.fsec{display:block;}
.fsec.hidden{display:none;}
.terms{font-size:11px;color:var(--muted);text-align:center;margin-top:16px;line-height:1.6;}
.terms a{color:var(--accent3);text-decoration:none;}
@keyframes spin{to{transform:rotate(360deg);}}
.spin{width:16px;height:16px;border:2px solid rgba(0,0,0,0.2);border-top-color:#0d0d0d;border-radius:50%;animation:spin 0.6s linear infinite;display:inline-block;}
.theme-row{display:flex;justify-content:flex-end;margin-bottom:16px;}
.theme-btn{background:transparent;border:1px solid rgba(128,128,128,.3);color:inherit;padding:6px 12px;border-radius:8px;font-family:inherit;font-size:12px;cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-logo">★ <span>HABIT</span>TRACKER</div>
    <div class="brand-sub">Build your best self · Every day</div>
  </div>
  <div class="theme-row">
    <button class="theme-btn" id="themeBtn" onclick="ThemeManager.toggle();this.textContent=ThemeManager.getCurrent()==='dark'?'☀️ Light':'🌙 Dark'">🌙 Dark</button>
  </div>
  <div class="card">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')" id="tl">Sign In</button>
      <button class="tab" onclick="switchTab('signup')" id="ts">Sign Up</button>
    </div>

    <div id="msg" class="msg"></div>

    <button class="btn-google" onclick="googleSignIn()">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continue with Google (Demo)
    </button>

    <div class="divider"><div class="divider-line"></div><div class="divider-text">or</div><div class="divider-line"></div></div>

    <!-- LOGIN -->
    <div class="fsec" id="fl">
      <div class="fg">
        <label>Email Address</label>
        <input type="email" id="le" placeholder="you@example.com" />
      </div>
      <div class="fg">
        <label>Password</label>
        <div class="ig">
          <input type="password" id="lp" placeholder="Your password" onkeydown="if(event.key==='Enter')doLogin()" />
          <span class="eye" onclick="togglePwd('lp',this)">👁</span>
        </div>
      </div>
      <div class="forgot"><a onclick="doForgot()">Forgot password?</a></div>
      <button class="btn-main" id="btnLogin" onclick="doLogin()">SIGN IN →</button>
    </div>

    <!-- SIGNUP -->
    <div class="fsec hidden" id="fs">
      <div class="fg">
        <label>Full Name</label>
        <input type="text" id="sn" placeholder="Your full name" />
      </div>
      <div class="fg">
        <label>Email Address</label>
        <input type="email" id="se" placeholder="you@example.com" />
      </div>
      <div class="fg">
        <label>Password</label>
        <div class="ig">
          <input type="password" id="sp" placeholder="Min. 8 characters" oninput="checkStrength(this.value)" />
          <span class="eye" onclick="togglePwd('sp',this)">👁</span>
        </div>
        <div class="sbar" id="sbar">
          <div class="seg" id="sg1"></div><div class="seg" id="sg2"></div>
          <div class="seg" id="sg3"></div><div class="seg" id="sg4"></div>
        </div>
      </div>
      <div class="fg">
        <label>Confirm Password</label>
        <input type="password" id="sc" placeholder="Re-enter password" onkeydown="if(event.key==='Enter')doSignup()" />
      </div>
      <button class="btn-main" id="btnSignup" onclick="doSignup()">CREATE ACCOUNT →</button>
      <div class="terms">By signing up you agree to our <a href="#">Terms</a> &amp; <a href="#">Privacy Policy</a></div>
    </div>
  </div>
</div>

<script>
// ── LOCAL AUTH SYSTEM (No Firebase needed) ──────────────────
const USERS_KEY   = 'ht_users_v1';
const SESSION_KEY = 'ht_session_v1';

function getUsers() {
  try { return JSON.parse(localStorage.getItem(USERS_KEY)) || []; } catch { return []; }
}
function saveUsers(u) { localStorage.setItem(USERS_KEY, JSON.stringify(u)); }
function getSession() { try { return JSON.parse(localStorage.getItem(SESSION_KEY)); } catch { return null; } }

// Auto redirect if already logged in
if (getSession()) window.location.href = 'index.html';

function showMsg(text, type='error') {
  const el = document.getElementById('msg');
  el.className = 'msg ' + type;
  el.textContent = text;
  el.style.display = 'block';
}
function clearMsg() { document.getElementById('msg').style.display = 'none'; }

function switchTab(tab) {
  clearMsg();
  document.getElementById('fl').classList.toggle('hidden', tab !== 'login');
  document.getElementById('fs').classList.toggle('hidden', tab !== 'signup');
  document.getElementById('tl').classList.toggle('active', tab === 'login');
  document.getElementById('ts').classList.toggle('active', tab === 'signup');
}

function togglePwd(id, el) {
  const inp = document.getElementById(id);
  inp.type = inp.type === 'password' ? 'text' : 'password';
  el.textContent = inp.type === 'password' ? '👁' : '🙈';
}

function checkStrength(pwd) {
  document.getElementById('sbar').style.display = 'flex';
  let s = 0;
  if (pwd.length >= 8) s++;
  if (/[A-Z]/.test(pwd)) s++;
  if (/[0-9]/.test(pwd)) s++;
  if (/[^A-Za-z0-9]/.test(pwd)) s++;
  const c = ['#f06060','#f0a060','#f0e060','#c8f060'];
  for (let i = 1; i <= 4; i++)
    document.getElementById('sg'+i).style.background = i <= s ? c[s-1] : '#2a2a2a';
}

function hashPassword(pwd) {
  // Simple hash for demo (in production use bcrypt on backend)
  let hash = 0;
  for (let i = 0; i < pwd.length; i++) {
    const char = pwd.charCodeAt(i);
    hash = ((hash << 5) - hash) + char;
    hash = hash & hash;
  }
  return hash.toString(36);
}

function doLogin() {
  clearMsg();
  const email    = document.getElementById('le').value.trim().toLowerCase();
  const password = document.getElementById('lp').value;
  if (!email || !password) { showMsg('Please fill in all fields.'); return; }

  const users = getUsers();
  const user  = users.find(u => u.email === email && u.password === hashPassword(password));

  if (!user) {
    showMsg('Invalid email or password. Try again or Sign Up.');
    return;
  }

  // Save session
  localStorage.setItem(SESSION_KEY, JSON.stringify({
    id: user.id, name: user.name, email: user.email,
    initials: user.name.slice(0,2).toUpperCase()
  }));

  showMsg('Welcome back, ' + user.name + '! Loading...', 'success');
  setTimeout(() => window.location.href = 'index.html', 800);
}

function doSignup() {
  clearMsg();
  const name     = document.getElementById('sn').value.trim();
  const email    = document.getElementById('se').value.trim().toLowerCase();
  const password = document.getElementById('sp').value;
  const confirm  = document.getElementById('sc').value;

  if (!name || !email || !password || !confirm) { showMsg('Please fill in all fields.'); return; }
  if (password.length < 8)   { showMsg('Password must be at least 8 characters.'); return; }
  if (password !== confirm)   { showMsg('Passwords do not match.'); return; }
  if (!/\S+@\S+\.\S+/.test(email)) { showMsg('Please enter a valid email.'); return; }

  const users = getUsers();
  if (users.find(u => u.email === email)) {
    showMsg('Account already exists. Sign in instead.');
    return;
  }

  const newUser = {
    id:       'u_' + Date.now(),
    name, email,
    password: hashPassword(password),
    createdAt: new Date().toISOString()
  };

  users.push(newUser);
  saveUsers(users);

  localStorage.setItem(SESSION_KEY, JSON.stringify({
    id: newUser.id, name, email,
    initials: name.slice(0,2).toUpperCase()
  }));

  showMsg('Account created! Setting up your tracker...', 'success');
  setTimeout(() => window.location.href = 'index.html', 900);
}

function googleSignIn() {
  // Demo Google sign in
  const demoUser = {
    id: 'google_demo_' + Date.now(),
    name: 'Demo User',
    email: 'demo@gmail.com',
    password: hashPassword('demo123'),
    createdAt: new Date().toISOString()
  };
  const users = getUsers();
  if (!users.find(u => u.email === demoUser.email)) {
    users.push(demoUser);
    saveUsers(users);
  }
  localStorage.setItem(SESSION_KEY, JSON.stringify({
    id: demoUser.id, name: 'Demo User',
    email: 'demo@gmail.com', initials: 'DU'
  }));
  showMsg('Signed in as Demo User! Loading...', 'success');
  setTimeout(() => window.location.href = 'index.html', 800);
}

function doForgot() {
  const email = document.getElementById('le').value.trim();
  if (!email) { showMsg('Enter your email first.'); return; }
  showMsg('Password reset: check your email (demo mode - check localStorage)', 'success');
}

// Fix theme button
document.addEventListener('DOMContentLoaded', () => {
  const btn = document.getElementById('themeBtn');
  if (btn) btn.textContent = ThemeManager.getCurrent() === 'dark' ? '☀️ Light' : '🌙 Dark';
});
</script>
</body>
</html>
